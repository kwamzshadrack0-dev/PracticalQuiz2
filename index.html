<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADRACK's PROJECT - No Images</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>
    <a-scene>
        <!-- Sky replaced with solid color -->
        <a-sky color="#87CEEB"></a-sky>

        <!-- Floor/Ground -->
        <a-cylinder position="0 -0.5 0" radius="100" height="0.5" color="ForestGreen"
            material="metalness: 0.2; roughness: 0.8">
            <a-circle position="0 0.26 0" rotation="-90 0 0" radius="9.8" color="LimeGreen"></a-circle>
        </a-cylinder>

        <!-- Table Assembly -->
        <a-entity position="0 0 0" scale="1.5 1.5 1.5">
            <!-- Table Leg -->
            <a-cylinder position="0 0.4 0" radius="0.2" height="0.8" color="DeepSkyBlue"
                material="emissive: DeepSkyBlue; emissiveIntensity: 0.2"></a-cylinder>
           
            <!-- Table Top (Replaced splash image with a clean marble-like color) -->
            <a-cylinder position="0 0.85 0" radius="1.2" height="0.05" color="#F0F0F0"></a-cylinder>
            <a-torus position="0 0.85 0" rotation="90 0 0" radius="1.2" radius-tubular="0.02" color="Silver"></a-torus>
            
            <!-- Milo Tin (Built with primitives: Green body + Yellow band + Silver lid) -->
             <a-entity position="0.4 0.88 0.2">
                <a-cylinder position="0 0.15 0" radius="0.12" height="0.3" color="#006B3C"></a-cylinder> <!-- Green Body -->
                <a-cylinder position="0 0.15 0" radius="0.122" height="0.1" color="#FFD700"></a-cylinder> <!-- Yellow Label Band -->
                <a-cylinder position="0 0.3 0" radius="0.125" height="0.01" color="Silver"></a-cylinder> <!-- Lid -->
                <a-cylinder position="0 0 0" radius="0.125" height="0.01" color="Silver"></a-cylinder> <!-- Bottom -->
            </a-entity>

            <!-- Cowbell Tin (Built with primitives: Blue body + White band) -->
            <a-entity position="-0.4 0.88 -0.3">
                <a-cylinder position="0 0.12 0" radius="0.1" height="0.24" color="#0033A0"></a-cylinder> <!-- Blue Body -->
                <a-cylinder position="0 0.12 0" radius="0.102" height="0.12" color="White"></a-cylinder> <!-- White Label Band -->
                <a-cylinder position="0 0.24 0" radius="0.105" height="0.01" color="Silver"></a-cylinder> <!-- Lid -->
            </a-entity>

            <!-- 2 Cups -->
            <a-entity position="0.3 0.88 -0.5" rotation="0 45 0">
                <a-cylinder radius="0.06" height="0.12" color="Skyblue"></a-cylinder>
                <a-torus position="0.06 0 0" radius="0.03" radius-tubular="0.01" rotation="0 90 0" color="White"></a-torus>
                <a-circle position="0 0.061 0" rotation="-90 0 0" radius="0.05" color="#FFFFFF"></a-circle> <!-- Liquid/Milk inside -->
            </a-entity>

            <a-entity position="-0.3 0.88 0.5" rotation="0 -135 0">
                <a-cylinder radius="0.06" height="0.12" color="Skyblue"></a-cylinder>
                <a-torus position="0.06 0 0" radius="0.03" radius-tubular="0.01" rotation="0 90 0" color="White"></a-torus>
                <a-circle position="0 0.061 0" rotation="-90 0 0" radius="0.05" color="#5C4033"></a-circle> <!-- Milo liquid inside -->
            </a-entity>
        </a-entity>

        <!-- Chair 1  -->
        <a-entity position="3 0 0" rotation="0 180 0" scale="1.3 1.3 1.3">
            <a-box position="0 0.45 0" width="0.7" height="0.08" depth="0.7" color="Gold"></a-box>
            <a-cylinder position="-0.35 0.7 0" radius="0.02" height="0.5" color="Silver"></a-cylinder>
            <a-box position="-0.4 0.85 0" width="0.1" height="0.4" depth="0.7" color="DarkSlateGray"></a-box>
            <a-cylinder position="0.25 0.22 0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="-0.25 0.22 0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="0.25 0.22 -0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="-0.25 0.22 -0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
        </a-entity>

        <!-- Chair 2 -->
        <a-entity position="-3 0 0" rotation="0 0 0" scale="1.3 1.3 1.3">
            <a-box position="0 0.45 0" width="0.7" height="0.08" depth="0.7" color="Gold"></a-box>
            <a-cylinder position="-0.35 0.7 0" radius="0.02" height="0.5" color="Silver"></a-cylinder>
            <a-box position="-0.4 0.85 0" width="0.1" height="0.4" depth="0.7" color="DarkSlateGray"></a-box>
            <a-cylinder position="0.25 0.22 0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="-0.25 0.22 0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="0.25 0.22 -0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
            <a-cylinder position="-0.25 0.22 -0.25" radius="0.03" height="0.44" color="Silver"></a-cylinder>
        </a-entity>

        <!-- Summer Hut -->
        <a-entity position="0 0 0">
            <!-- 4 Pillars -->
            <a-cylinder position="3.54 2.5 3.54" radius="0.1" height="6" color="Gold"
                material="metalness: 0.8; roughness: 0.2"></a-cylinder>
            <a-cylinder position="-3.54 2.5 3.54" radius="0.1" height="6" color="Gold"
                material="metalness: 0.8; roughness: 0.2"></a-cylinder>
            <a-cylinder position="3.54 2.5 -3.54" radius="0.1" height="6" color="Gold"
                material="metalness: 0.8; roughness: 0.2"></a-cylinder>
            <a-cylinder position="-3.54 2.5 -3.54" radius="0.1" height="6" color="Gold"
                material="metalness: 0.8; roughness: 0.2"></a-cylinder>

            <!-- Roof -->
            <a-entity position="0 6.5 0">
                <a-cone radius-bottom="6" radius-top="0" height="2" color="LightBlue" opacity="0.6"
                    material="transparent: true; side: double; metalness: 0.5; roughness: 0.1"></a-cone>
                <a-cone radius-bottom="6.01" radius-top="0.01" height="2.01" color="Silver"
                    material="wireframe: true; wireframeLinewidth: 2; segments-radial: 12; segments-height: 4"></a-cone>
                <a-torus position="0 -1 0" rotation="90 0 0" radius="6" radius-tubular="0.05" color="Gold"
                    material="metalness: 0.8; roughness: 0.2"></a-torus>
            </a-entity>

            <!-- Inner Low Wall -->
            <a-cylinder position="0 1 0" radius="5" height="2" color="WhiteSmoke"
                material="metalness: 0.1; roughness: 0.8; side: double" open-ended="true" theta-start="45"
                theta-length="270"></a-cylinder>

            <!-- Outer Background Wall -->
            <a-cylinder position="0 1.5 -12" radius="25" height="5" color="Aquamarine"
                material="metalness: 0.1; roughness: 0.8; side: double" open-ended="true" theta-start="45"
                theta-length="270"></a-cylinder>
        </a-entity>

        <!-- Camera -->
        <a-entity position="0 2 12">
            <a-camera></a-camera>
        </a-entity>
    </a-scene>
</body>
</html>
